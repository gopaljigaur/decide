name: Bug
description: Something does not do what it says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what you got, and the error text if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest script that shows it, with the backend you used.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pydecide version
      placeholder: "0.2.18"
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend and its version
      description: For a local model, the checkpoint too.
      placeholder: "laya_mlx, laya-mlx 0.4.0, aac6fef/laya-mlx"
  - type: input
    id: python
    attributes:
      label: Python and OS
      placeholder: "3.12, macOS 27"
