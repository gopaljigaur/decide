[project]
name = "pydecide"
version = "0.1.0"
description = "One client for every decision model: Choice, Score and Noul over Jev, OpenRouter, laya, MLX, CrossEncoders and an LLM fallback."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Gopalji Gaur" }]
keywords = ["jev", "typesafe", "decision model", "system one", "laya", "classification", "routing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
laya = ["laya>=0.3"]
mlx = ["laya-mlx>=0.1 ; python_version >= '3.11'"]
st = ["sentence-transformers>=3.0", "torch"]
all = ["pydecide[server,laya,mlx,st]"]

[project.scripts]
decide = "decide.cli:main"

[project.urls]
Homepage = "https://github.com/gopaljigaur/decide"
Issues = "https://github.com/gopaljigaur/decide/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decide"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27", "typesafe-sdk", "jsonschema>=4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits a real API or loads a real model; skipped unless RUN_LIVE=1"]
addopts = "-q"
filterwarnings = [
  # starlette.testclient imports anyio.abc.BlockingPortal (a deprecated alias for
  # anyio.from_thread.BlockingPortal) at module import time; this is a starlette/anyio
  # version-compat warning, not ours to fix, so it's narrowly ignored by message and
  # source module rather than silencing DeprecationWarning broadly.
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\\.testclient",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
